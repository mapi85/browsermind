<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>BrowserMind</title>
  <link rel="stylesheet" href="src/shared.css"/>
  <link rel="stylesheet" href="src/config.css"/>
</head>
<body>

<header class="settings-header">
  <div class="settings-header-inner">
    <div class="brand">
      <span class="brand-mark" id="brand-mark"></span>
      <h1 class="brand-name" data-i18n="settingsTitle"></h1>
    </div>
    <div class="header-right">
      <span class="save-state" id="save-state"></span>
      <button class="btn btn-primary" id="save-btn" data-i18n="save"></button>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab is-active" data-tab="service" data-i18n="tabModel"></button>
    <button class="tab" data-tab="general" data-i18n="tabGeneral"></button>
  </nav>
</header>

<main class="settings-body">

  <!-- ── AI SERVICE ── -->
  <section class="panel is-active" id="panel-service">
    <div class="section-head">
      <h2 class="section-title" data-i18n="providerListTitle"></h2>
      <button class="btn btn-secondary btn-sm" id="add-provider-btn">
        <span id="add-provider-icon"></span><span data-i18n="providerAdd"></span>
      </button>
    </div>

    <p class="hint" id="providers-empty" data-i18n="providerNone"></p>
    <div class="provider-list" id="provider-list"></div>

    <p class="privacy-note hint" data-i18n="privacyNote"></p>
  </section>

  <!-- ── GENERAL ── -->
  <section class="panel" id="panel-general">

    <div class="group">
      <h2 class="section-title" data-i18n="secLanguage"></h2>
      <div class="grid-2">
        <label class="field">
          <span class="label" data-i18n="optUiLang"></span>
          <select class="select" id="ui-lang"></select>
        </label>
        <label class="field">
          <span class="label" data-i18n="optAgentLang"></span>
          <select class="select" id="agent-lang"></select>
        </label>
      </div>
    </div>

    <div class="group">
      <h2 class="section-title" data-i18n="secAppearance"></h2>
      <label class="field">
        <span class="label" data-i18n="optTheme"></span>
        <select class="select" id="theme">
          <option value="system" data-i18n="themeSystem"></option>
          <option value="light" data-i18n="themeLight"></option>
          <option value="dark" data-i18n="themeDark"></option>
        </select>
      </label>
      <label class="switch-row">
        <span>
          <span class="label" data-i18n="optHighlight"></span>
          <span class="hint" data-i18n="optHighlightHint"></span>
        </span>
        <span class="switch"><input type="checkbox" id="highlight-actions"/><span class="switch-track"></span></span>
      </label>
    </div>

    <div class="group">
      <h2 class="section-title" data-i18n="secBehaviour"></h2>
      <label class="field">
        <span class="label" data-i18n="optInstructions"></span>
        <span class="hint" data-i18n="optInstructionsHint"></span>
        <textarea class="textarea" id="system-prompt" data-i18n-attr="placeholder:optInstructionsPlaceholder"></textarea>
      </label>
      <label class="field field-inline">
        <span>
          <span class="label" data-i18n="optMaxSteps"></span>
          <span class="hint" data-i18n="optMaxStepsHint"></span>
        </span>
        <input class="input input-narrow" id="max-iterations" type="number" min="3" max="60" step="1"/>
      </label>
      <label class="switch-row">
        <span class="label" data-i18n="optNavAlways"></span>
        <span class="switch"><input type="checkbox" id="nav-always-allow"/><span class="switch-track"></span></span>
      </label>
    </div>

    <div class="group">
      <h2 class="section-title" data-i18n="secMemory"></h2>
      <label class="switch-row">
        <span class="label" data-i18n="optMemory"></span>
        <span class="switch"><input type="checkbox" id="memory-enabled"/><span class="switch-track"></span></span>
      </label>
      <div class="memory-list" id="memory-list"></div>
      <button class="btn btn-danger btn-sm self-start" id="memory-clear" data-i18n="memoryForgetAll"></button>
    </div>

    <div class="group">
      <h2 class="section-title" data-i18n="secHistory"></h2>
      <label class="switch-row">
        <span class="label" data-i18n="optHistory"></span>
        <span class="switch"><input type="checkbox" id="history-enabled"/><span class="switch-track"></span></span>
      </label>
      <label class="field field-inline">
        <span class="label" data-i18n="optRetention"></span>
        <input class="input input-narrow" id="history-retention" type="number" min="1" max="200" step="1"/>
      </label>
      <input class="input" id="history-search" data-i18n-attr="placeholder:historySearch"/>
      <div class="history-list" id="history-list"></div>
      <button class="btn btn-danger btn-sm self-start" id="history-clear" data-i18n="historyClear"></button>
    </div>

    <div class="group">
      <h2 class="section-title" data-i18n="secAdvanced"></h2>
      <label class="switch-row">
        <span>
          <span class="label" data-i18n="optDebug"></span>
          <span class="hint" data-i18n="optDebugHint"></span>
        </span>
        <span class="switch"><input type="checkbox" id="debug-mode"/><span class="switch-track"></span></span>
      </label>
    </div>

  </section>
</main>

<!-- ── ADD SERVICE WIZARD ── -->
<dialog class="wizard" id="wizard">
  <header class="wizard-head">
    <h2 class="wizard-title" data-i18n="wizardTitle"></h2>
    <button class="icon-btn" id="wizard-close"></button>
  </header>

  <ol class="wizard-steps" id="wizard-steps">
    <li data-step="1" data-i18n="wizardStepService"></li>
    <li data-step="2" data-i18n="wizardStepKey"></li>
    <li data-step="3" data-i18n="wizardStepModel"></li>
  </ol>

  <!-- Step 1 -->
  <div class="wizard-step is-active" data-step="1">
    <div class="service-grid" id="service-grid"></div>
    <details class="others">
      <summary data-i18n="wizardOthers"></summary>
      <div class="service-grid service-grid-compact" id="service-grid-others"></div>
    </details>
  </div>

  <!-- Step 2 -->
  <div class="wizard-step" data-step="2">
    <p class="hint" data-i18n="wizardNeedKey"></p>

    <label class="field" id="wizard-url-field" hidden>
      <span class="label" data-i18n="wizardUrlLabel"></span>
      <input class="input input-key" id="wizard-url" placeholder="http://localhost:11434/v1"/>
      <span class="hint" data-i18n="wizardUrlHint"></span>
    </label>

    <label class="field" id="wizard-name-field" hidden>
      <span class="label" data-i18n="wizardNameLabel"></span>
      <input class="input" id="wizard-name"/>
    </label>

    <label class="field">
      <span class="label" data-i18n="wizardKeyLabel"></span>
      <input class="input input-key" id="wizard-key" type="password" autocomplete="off" spellcheck="false"/>
      <a id="wizard-key-link" target="_blank" rel="noopener" data-i18n="wizardGetKey"></a>
    </label>

    <div class="status-msg" id="wizard-status" hidden></div>

    <div class="wizard-actions">
      <button class="btn btn-secondary" id="wizard-back-2" data-i18n="back"></button>
      <button class="btn btn-primary" id="wizard-check" data-i18n="next"></button>
    </div>
  </div>

  <!-- Step 3 -->
  <div class="wizard-step" data-step="3">
    <div class="status-msg ok" id="wizard-connected"></div>

    <div class="model-options" id="model-options"></div>
    <label class="field" id="all-models-field" hidden>
      <span class="label" data-i18n="providerChangeModel"></span>
      <select class="select" id="all-models"></select>
    </label>
    <button class="btn btn-quiet btn-sm self-start" id="show-all-models" data-i18n="wizardShowAll"></button>

    <p class="hint" data-i18n="wizardModelHint"></p>

    <div class="wizard-actions">
      <button class="btn btn-secondary" id="wizard-back-3" data-i18n="back"></button>
      <button class="btn btn-primary" id="wizard-finish" data-i18n="wizardFinish"></button>
    </div>
  </div>
</dialog>

<script type="module" src="src/configpage/main.js"></script>
</body>
</html>
