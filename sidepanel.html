<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>BrowserMind</title>
  <link rel="stylesheet" href="src/shared.css"/>
  <link rel="stylesheet" href="src/sidepanel.css"/>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <span class="brand-mark" id="brand-mark"></span>
    <span class="brand-name">BrowserMind</span>
  </div>

  <div class="header-actions">
    <label class="model-chip" id="model-chip" hidden>
      <span class="visually-hidden" data-i18n="providerChangeModel">Model</span>
      <select id="model-select" class="model-select"></select>
    </label>
    <button class="icon-btn" id="new-chat-btn" data-i18n-attr="title:newChat,aria-label:newChat"></button>
    <button class="icon-btn" id="settings-btn" data-i18n-attr="title:settings,aria-label:settings"></button>
  </div>
</header>

<div class="setup-banner" id="setup-banner" hidden>
  <span id="setup-banner-text"></span>
  <button class="btn btn-primary btn-sm" id="setup-banner-btn" data-i18n="configure"></button>
</div>

<main id="messages" aria-live="polite">
  <section class="empty-state" id="empty-state">
    <span class="empty-mark" id="empty-mark"></span>
    <h1 class="empty-title" data-i18n="emptyTitle"></h1>
    <p class="empty-body" data-i18n="emptyBody"></p>
  </section>
</main>

<button class="background-task" id="background-task" hidden></button>

<div class="composer">
  <div class="page-chip" id="page-chip" hidden>
    <span class="page-chip-mark" id="page-chip-mark"></span>
    <span class="page-chip-title" id="page-chip-title"></span>
  </div>

  <div class="composer-box">
    <textarea id="prompt" rows="1" data-i18n-attr="placeholder:composerPlaceholder"></textarea>
    <div class="composer-actions">
      <span class="composer-status" id="composer-status"></span>
      <button class="btn btn-secondary btn-sm" id="stop-btn" hidden>
        <span data-i18n="stop"></span>
      </button>
      <button class="btn btn-primary btn-sm" id="send-btn">
        <span data-i18n="send"></span>
      </button>
    </div>
  </div>
  <p class="composer-hint" data-i18n="sendHint"></p>
</div>

<dialog class="nav-dialog" id="nav-dialog">
  <h2 class="nav-dialog-title" data-i18n="navTitle"></h2>
  <p class="nav-dialog-body" id="nav-dialog-body"></p>
  <label class="nav-dialog-always">
    <input type="checkbox" id="nav-always"/>
    <span data-i18n="navAlways"></span>
  </label>
  <div class="nav-dialog-actions">
    <button class="btn btn-secondary" id="nav-cancel" data-i18n="navCancel"></button>
    <button class="btn btn-primary" id="nav-allow" data-i18n="navAllow"></button>
  </div>
</dialog>

<script src="src/lib/marked.min.js"></script>
<script type="module" src="src/panel/main.js"></script>
</body>
</html>
